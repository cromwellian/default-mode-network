[project]
name = "default-mode-network"
version = "0.2.0"
description = "A taste-driven autoresearcher: the idle network of an AI mind."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "default-mode-network contributors" }]
keywords = ["llm", "research", "autoresearch", "embeddings", "taste"]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "arxiv>=2.1.0",
    "wikipedia-api>=0.7.0",
    "duckduckgo-search>=6.0.0",
    "requests>=2.31.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
musicbrainz = ["musicbrainzngs>=0.7.1"]
image = ["google-genai>=0.3.0", "replicate>=0.30.0", "Pillow>=10.0.0"]
music = ["google-genai>=0.3.0"]
video = []
generators = ["google-genai>=0.3.0", "replicate>=0.30.0", "Pillow>=10.0.0"]

[project.urls]
Homepage = "https://github.com/cromwellian/default-mode-network"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dmn"]

[tool.hatch.build.targets.sdist]
include = [
    "dmn/",
    "prepare.py",
    "explore.py",
    "wander.py",
    "profile.py",
    "program.md",
    "SKILL.md",
    "README.md",
    "LICENSE",
]
