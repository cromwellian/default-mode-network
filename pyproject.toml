[project]
name = "default-mode-network"
version = "0.5.0"
description = "A taste-driven autoresearcher: the idle network of an AI mind."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "default-mode-network contributors" }]
keywords = ["llm", "research", "autoresearch", "embeddings", "taste"]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "arxiv>=2.1.0",
    "wikipedia-api>=0.7.0",
    "ddgs>=9.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.4.0",
    "hdbscan>=0.8.33",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Local ML embeddings (pulls in torch — needs a platform with current torch wheels).
# Without it DMN uses fast hash-fallback embeddings; clusters are rougher but everything runs.
embeddings = ["sentence-transformers>=3.0.0"]
musicbrainz = ["musicbrainzngs>=0.7.1"]
image = ["google-genai>=0.3.0", "replicate>=0.30.0", "Pillow>=10.0.0", "huggingface-hub>=0.26.0"]
music = ["requests>=2.31.0", "google-genai>=0.3.0"]
video = ["replicate>=0.30.0"]
generators = ["google-genai>=0.3.0", "replicate>=0.30.0", "Pillow>=10.0.0", "requests>=2.31.0"]
# v0.3 activities — opt-in extras for the heavier code/ml paths
code = ["matplotlib>=3.8.0"]
ml = ["torch>=2.2.0", "numpy>=1.26.0"]
activities = ["matplotlib>=3.8.0", "torch>=2.2.0", "requests>=2.31.0"]
dev = ["pytest>=8.0.0"]
modal = ["modal>=0.64.0", "fastapi[standard]>=0.115.0", "python-multipart>=0.0.9"]

[project.scripts]
dmn-setup = "dmn.setup_wizard:run"
dmn-prepare = "dmn.cli:prepare"
dmn-explore = "dmn.cli:explore"
dmn-wander = "dmn.cli:wander"
dmn-profile = "profile:app"
dmn-journal = "journal:app"
dmn-eval = "eval:app"

[project.urls]
Homepage = "https://github.com/cromwellian/default-mode-network"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dmn"]

[tool.hatch.build.targets.sdist]
include = [
    "dmn/",
    "prepare.py",
    "explore.py",
    "wander.py",
    "journal.py",
    "profile.py",
    "eval.py",
    "program.md",
    "SKILL.md",
    "README.md",
    "LICENSE",
    "modal_api/",
]
